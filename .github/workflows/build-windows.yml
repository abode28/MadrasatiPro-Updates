name: Build Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get project source
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Verify Arabic shaping and image libraries
        run: python -c "import arabic_reshaper; from bidi.algorithm import get_display; from PIL import Image, ImageTk; print('Arabic shaping and image preview dependencies OK')"
      - name: Check source and database tests
        run: |
          python -m py_compile school_manager.py updater.py
          python -m unittest discover -s tests -v
      - name: Build Windows application
        run: pyinstaller --clean --noconfirm school_manager_pro.spec
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\SchoolManagerPro.iss'
      - name: Upload installer and packaged app
        uses: actions/upload-artifact@v4
        with:
          name: SchoolManagerPro-Windows-${{ github.run_number }}
          path: |
            dist-installer/SchoolManagerPro_Setup_*.exe
            dist/SchoolManagerPro/**
          if-no-files-found: error
          retention-days: 30
